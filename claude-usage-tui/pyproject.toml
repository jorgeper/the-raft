[project]
name = "claude-usage-tui"
version = "0.1.0"
description = "Terminal dashboard for Claude Code usage: rate-limit meters, token/cost stats, active sessions"
requires-python = ">=3.12"
dependencies = ["textual>=1.0"]

[project.scripts]
claude-usage = "claude_usage.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_usage"]

[dependency-groups]
dev = ["pytest>=8"]
