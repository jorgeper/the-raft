<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meadows</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      body { display: flex; align-items: center; justify-content: center; }
      #stage { position: relative; line-height: 0; }
      .minimap { position: absolute; top: 14px; left: 14px; line-height: 1.2; font-family: Georgia, 'Times New Roman', serif; color: #f3e9cf; text-shadow: 0 1px 3px #000; user-select: none; }
      .minimap-frame { position: relative; border: 2px solid rgba(214, 186, 120, 0.85); border-radius: 50%; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.6); cursor: crosshair; aspect-ratio: 1; }
      .minimap-frame canvas { position: absolute; inset: 0; display: block; }
      .minimap-biome { text-align: center; margin-top: 8px; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
      .minimap-coords { text-align: center; font: 11px/1.4 system-ui, sans-serif; opacity: .7; }
      canvas { display: block; }
      #hint {
        position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
        font: 13px/1.4 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.45);
        padding: 8px 14px; border-radius: 6px; pointer-events: none; transition: opacity .3s;
      }
      /* Always-visible reminder of the panel key, even while playing. */
      #menu-key {
        position: fixed; right: 12px; bottom: 10px; pointer-events: none; user-select: none;
        font: 12px/1 system-ui, sans-serif; color: rgba(255,255,255,.85); background: rgba(0,0,0,.35);
        padding: 6px 9px; border-radius: 5px; letter-spacing: .02em;
      }
      #menu-key kbd { font: 600 11px/1 system-ui, sans-serif; border: 1px solid rgba(255,255,255,.6); border-radius: 3px; padding: 1px 5px; margin-right: 5px; }
      .fps {
        position: absolute; left: 12px; bottom: 10px; pointer-events: none; user-select: none; line-height: 1;
        font: 600 12px/1 ui-monospace, Menlo, monospace; background: rgba(0,0,0,.4); padding: 6px 8px; border-radius: 5px;
      }
      /* Flythrough and photo mode: no HUD, and cinema bars (2.39:1) that slide in. */
      body.cinema #hint, body.cinema #menu-key, body.cinema .minimap, body.cinema .fps, body.cinema .lil-gui.lil-root { display: none !important; }
      .bar { position: absolute; left: 0; right: 0; height: 0; background: #000; pointer-events: none; transition: height 1.2s ease; }
      .bar.top { top: 0; } .bar.bottom { bottom: 0; }
      body.letterbox .bar { height: 12.8%; }
      /* Photo mode's viewfinder. */
      #photo { position: absolute; inset: 0; pointer-events: none; display: none; line-height: 1.2; }
      body.photo #photo { display: block; }
      #photo .corner { position: absolute; width: 34px; height: 34px; border: 0 solid rgba(255,255,255,.75); }
      #photo .tl { left: 22px; top: 22px; border-left-width: 2px; border-top-width: 2px; }
      #photo .tr { right: 22px; top: 22px; border-right-width: 2px; border-top-width: 2px; }
      #photo .bl { left: 22px; bottom: 22px; border-left-width: 2px; border-bottom-width: 2px; }
      #photo .br { right: 22px; bottom: 22px; border-right-width: 2px; border-bottom-width: 2px; }
      #photo .reticle { position: absolute; width: 26px; height: 18px; transform: translate(-50%, -50%); border: 1.5px solid rgba(255,255,255,.8); border-radius: 2px; }
      #photo .reticle.locked { border-color: rgba(130, 255, 160, .95); }
      #photo .info { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); white-space: nowrap; font: 12px/1 ui-monospace, Menlo, monospace; color: rgba(255,255,255,.9); text-shadow: 0 1px 2px #000; }
      body.photo.clean #photo { display: none; }
      /* Demo film: fades, captions (in the lower cinema bar when it's on), a title card, a viewfinder, the print. */
      .demo { position: absolute; inset: 0; pointer-events: none; line-height: 1.35; display: none; }
      body.demo-on .demo { display: block; }
      .demo-fade, .demo-flash { position: absolute; inset: 0; opacity: 0; }
      .demo-fade { background: #000; }
      .demo-flash { background: #fff; }
      .demo-caption {
        position: absolute; left: 50%; bottom: 3.4%; transform: translateX(-50%); width: min(82%, 980px); text-align: center;
        font-family: Georgia, 'Times New Roman', serif; color: #f4ecd8; text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 18px rgba(0,0,0,.5); opacity: 0;
      }
      .demo-title { font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: #e6c98a; margin-bottom: 5px; }
      .demo-line { font-size: 18px; font-style: italic; }
      .demo-card {
        position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); width: 90%; text-align: center; opacity: 0;
        font-family: Georgia, 'Times New Roman', serif; color: #f7efdc; text-shadow: 0 2px 14px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.6);
      }
      .demo-card-title { font-size: 76px; letter-spacing: .34em; text-transform: uppercase; margin-right: -.34em; }
      .demo-card-line { font-size: 19px; font-style: italic; margin-top: 10px; opacity: .92; }
      .demo-vf { position: absolute; inset: 15.5% 5% 15.5% 5%; display: none; }
      .demo-corner { position: absolute; width: 34px; height: 34px; border: 0 solid rgba(255,255,255,.8); }
      .demo-corner.tl { left: 0; top: 0; border-left-width: 2px; border-top-width: 2px; }
      .demo-corner.tr { right: 0; top: 0; border-right-width: 2px; border-top-width: 2px; }
      .demo-corner.bl { left: 0; bottom: 0; border-left-width: 2px; border-bottom-width: 2px; }
      .demo-corner.br { right: 0; bottom: 0; border-right-width: 2px; border-bottom-width: 2px; }
      .demo-vf-info { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); white-space: nowrap; font: 12px/1 ui-monospace, Menlo, monospace; color: rgba(255,255,255,.9); text-shadow: 0 1px 2px #000; }
      .demo-print { position: absolute; right: 7%; bottom: 19%; width: 24%; padding: 9px 9px 30px; background: #f6f2e8; box-shadow: 0 10px 28px rgba(0,0,0,.55); opacity: 0; }
      .demo-print img { display: block; width: 100%; }
      #busy {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(10, 14, 12, .45); color: #fff; font: 600 18px/1 system-ui, sans-serif; letter-spacing: .02em;
      }
    </style>
  </head>
  <body>
    <div id="busy">Generating world…</div>
    <div id="menu-key"><kbd>H</kbd>menu</div>
    <div id="stage">
      <div id="hint">Click to look around · WASD move · Shift run · Space jump · T torch · V first/third person (wheel zooms) · F fly (Space / C up / down) · M map · N sound · H menu · P fps · K flythrough · J demo film · O photo mode · Esc release (then click the map to travel)</div>
      <div class="bar top"></div><div class="bar bottom"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
