<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meadows</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      body { display: flex; align-items: center; justify-content: center; }
      #stage { position: relative; line-height: 0; }
      .minimap { position: absolute; top: 14px; left: 14px; line-height: 1.2; font-family: Georgia, 'Times New Roman', serif; color: #f3e9cf; text-shadow: 0 1px 3px #000; user-select: none; }
      .minimap-frame { position: relative; border: 2px solid rgba(214, 186, 120, 0.85); border-radius: 50%; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.6); cursor: crosshair; aspect-ratio: 1; }
      .minimap-frame canvas { position: absolute; inset: 0; display: block; }
      .minimap-biome { text-align: center; margin-top: 8px; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
      .minimap-coords { text-align: center; font: 11px/1.4 system-ui, sans-serif; opacity: .7; }
      canvas { display: block; }
      #hint {
        position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
        font: 13px/1.4 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.45);
        padding: 8px 14px; border-radius: 6px; pointer-events: none; transition: opacity .3s;
      }
      /* Always-visible reminder of the panel key, even while playing. */
      #menu-key {
        position: fixed; right: 12px; bottom: 10px; pointer-events: none; user-select: none;
        font: 12px/1 system-ui, sans-serif; color: rgba(255,255,255,.85); background: rgba(0,0,0,.35);
        padding: 6px 9px; border-radius: 5px; letter-spacing: .02em;
      }
      #menu-key kbd { font: 600 11px/1 system-ui, sans-serif; border: 1px solid rgba(255,255,255,.6); border-radius: 3px; padding: 1px 5px; margin-right: 5px; }
      .fps {
        position: absolute; left: 12px; bottom: 10px; pointer-events: none; user-select: none; line-height: 1;
        font: 600 12px/1 ui-monospace, Menlo, monospace; background: rgba(0,0,0,.4); padding: 6px 8px; border-radius: 5px;
      }
      #busy {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(10, 14, 12, .45); color: #fff; font: 600 18px/1 system-ui, sans-serif; letter-spacing: .02em;
      }
    </style>
  </head>
  <body>
    <div id="busy">Generating world…</div>
    <div id="menu-key"><kbd>H</kbd>menu</div>
    <div id="stage">
      <div id="hint">Click to look around · WASD move · Shift run · Space jump · T torch · V first/third person (wheel zooms) · F fly (Space / C up / down) · M map · N sound · H menu · P fps · Esc release (then click the map to travel)</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
