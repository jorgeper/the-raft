[package]
name = "mail-archive-app"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "mail-archive-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mail-core = { path = "../../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
chrono = { version = "0.4.45", features = ["clock"] }
percent-encoding = "2.3.2"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
mail-core = { path = "../../crates/core", features = ["testing"] }
tempfile = "3.27.0"

[features]
# Set by `tauri build`; serves the bundled frontend instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]
