[package]
name = "mail-cli"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "mail-cli"
path = "src/main.rs"

[dependencies]
mail-core = { path = "../core" }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
chrono = { version = "0.4.45", features = ["clock"] }

[dev-dependencies]
mail-core = { path = "../core", features = ["testing"] }
tempfile = "3.27.0"
