[package]
name = "mail-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
# Synthetic fixture builders for integration tests and other crates.
testing = ["dep:base64", "dep:zip"]

[dependencies]
base64 = { version = "0.23.1", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
zip = { version = "9.4.2", optional = true, default-features = false, features = ["deflate"] }
zstd = "0.14.3"

[dev-dependencies]
base64 = "0.23.1"
tempfile = "3.27.0"
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }
