[package]
name = "mail-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
# Synthetic fixture builders for integration tests and other crates.
testing = ["dep:base64", "dep:zip"]

[dependencies]
base64 = { version = "0.23.1", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
zip = { version = "9.4.2", optional = true, default-features = false, features = ["deflate"] }

[dev-dependencies]
base64 = "0.23.1"
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }
