services:
  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - site

  site:
    build: site
    restart: unless-stopped

  # hank/, hank-web/, buckos/, playground/ and rippy-rippy/ are kept in the repo as code
  # but are not deployed. See ADDING-AN-APP.md to wire an app back in.

volumes:
  caddy_data:
